<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>OpenERX 浏览器授权</title><style>body{font:14px system-ui;width:320px;margin:20px;color:#18212b}h1{font-size:18px}p{line-height:1.6}input,button{box-sizing:border-box;width:100%;padding:10px;margin:5px 0}button{cursor:pointer}#authorize{background:#215bdf;color:white;border:0;border-radius:6px}#status{white-space:pre-wrap}</style><h1>OpenERX 浏览器授权</h1><p>从 OpenERX 的「工具 → 浏览器」复制配对码。配对后，点击下方按钮授权当前标签页。</p><label>配对码<input id="code" type="password" autocomplete="off" placeholder="粘贴配对码"></label><button type="button" id="pair">配对 OpenERX</button><button type="button" id="authorize">授权当前标签页</button><button type="button" id="disconnect">断开并撤销授权</button><p>授权仅限当前网站。切换标签页、关闭页面或断开连接后需重新授权。您可以随时操作页面，OpenERX 会暂停自动操作。</p><p id="status" role="status"></p><script src="popup.js"></script></html>
