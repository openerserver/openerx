server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name opener-x.com www.opener-x.com 205.185.120.94 _;

    root /var/www/html;
    index index.html;

    location = /investment/llm-pricing-model {
        try_files /investment/llm-pricing-model.html =404;
    }

    location = /investment/llm-pricing-model-findings {
        try_files /investment/llm-pricing-model-findings.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name opener-x.com www.opener-x.com 205.185.120.94 _;

    ssl_certificate /etc/ssl/certs/opener-x-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/opener-x-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/html;
    index index.html;

    location = /investment/llm-pricing-model {
        try_files /investment/llm-pricing-model.html =404;
    }

    location = /investment/llm-pricing-model-findings {
        try_files /investment/llm-pricing-model-findings.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
}
