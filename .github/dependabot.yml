version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns:
          - '@electron-forge/*'
      pi:
        patterns:
          - '@earendil-works/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
