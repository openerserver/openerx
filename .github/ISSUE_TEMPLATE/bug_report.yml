name: Bug report / 错误报告
description: 报告可复现的开源版问题（不要公开漏洞或隐私数据）
body:
  - type: markdown
    attributes:
      value: 请先阅读 SUPPORT.md。安全漏洞请使用私有报告渠道；不要上传密钥、完整数据库或聊天内容。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统、CPU 架构、Node/npm 版本及安装方式
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除凭据、个人信息及企业私有材料，且这不是应私下报告的安全漏洞。
          required: true
